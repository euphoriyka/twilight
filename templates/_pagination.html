{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Страницы">
  {% if page.has_previous %}<a class="btn btn-ghost" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">‹</a>{% endif %}
  <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">›</a>{% endif %}
</nav>
{% endif %}
